name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            libssl-dev \
            libmariadb-dev \
            libmariadb-dev-compat \
            zlib1g-dev \
            libcurl4-openssl-dev

      - name: Get current version
        id: get_version
        run: |
          if git describe --tags --abbrev=0 2>/dev/null; then
            CURRENT_VERSION=$(git describe --tags --abbrev=0 | sed 's/v//')
          else
            CURRENT_VERSION="0.0.0"
          fi
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump_version
        run: |
          VERSION="${{ steps.get_version.outputs.current_version }}"
          IFS='.' read -ra PARTS <<< "$VERSION"
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}

          case "${{ github.event.inputs.version_bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Configure CMake
        run: |
          # RelWithDebInfo keeps optimized code AND embeds debug symbols so the
          # built binary can be uploaded to Sentry for crash symbolication.
          cmake -B ProjectServer/build -S ProjectServer -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: |
          cmake --build ProjectServer/build --target communicatorsrv -j$(nproc)

      - name: Check Sentry secrets
        id: sentry_check
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload debug symbols to Sentry
        if: steps.sentry_check.outputs.enabled == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          curl -sL https://sentry.io/get-cli/ | bash

          # The release identifier is the git commit hash — the exact value that
          # was compiled into the binary via CMake (SQRLL_VERSION).  This keeps
          # the uploaded debug symbols matched to the exact build that ships.
          RELEASE="$(git rev-parse --short HEAD)"

          sentry-cli releases new "$RELEASE"
          sentry-cli debug-files upload \
            --include-sources \
            ProjectServer/build/bin/Release/Project/communicatorsrv
          sentry-cli releases finalize "$RELEASE"

      - name: Package binary
        run: |
          cd ProjectServer/build/bin/Release/Project
          # crashpad_handler is copied next to the binary by CMake post-build when
          # Sentry is enabled, and must ship alongside it for crash reporting.
          PACKAGE_FILES="communicatorsrv Assets/"
          if [ -f crashpad_handler ]; then
            PACKAGE_FILES="communicatorsrv crashpad_handler Assets/"
          fi
          tar -czf communicatorsrv-${{ steps.bump_version.outputs.new_version }}-linux-x64.tar.gz \
            $PACKAGE_FILES
          mv communicatorsrv-${{ steps.bump_version.outputs.new_version }}-linux-x64.tar.gz $GITHUB_WORKSPACE/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_version.outputs.tag }}
          name: Release ${{ steps.bump_version.outputs.new_version }}
          draft: false
          prerelease: false
          files: |
            communicatorsrv-${{ steps.bump_version.outputs.new_version }}-linux-x64.tar.gz
          body: |
            ## Communicator Server ${{ steps.bump_version.outputs.new_version }}

            ### Changes
            - Automated build from commit ${{ github.sha }}

            ### Download
            - **Linux x64**: `communicatorsrv-${{ steps.bump_version.outputs.new_version }}-linux-x64.tar.gz`

            ### Installation
            ```bash
            tar -xzf communicatorsrv-${{ steps.bump_version.outputs.new_version }}-linux-x64.tar.gz
            chmod +x communicatorsrv
            [ -f crashpad_handler ] && chmod +x crashpad_handler
            ./communicatorsrv
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
