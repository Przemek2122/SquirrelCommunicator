# Backend settings

# Explicit listen host for the REST (HTTP) server (bind to loopback only)
RestListenHost = 127.0.0.1

# Server port for HTTP/REST connections
Port = 8080

# Explicit listen host for the WebSocket server (bind to loopback only)
SocketListenHost = 127.0.0.1

# Server port for WebSocket
PortWS = 8081

# Production address (Can be multiple if needed BackendAddress2, BackendAddress3, ...)
BackendAddress1 = https://comm.sqrll.net

# Actual domain used in production
Domain = .sqrll.net

# Same as Domain but for debug configuration (Overrides Domain) - Also adds BackendAddress to whitlelist
DebugDomain = localhost

# Decide if you want SSL enabled (Disable for local debug as SSL on localhost will fail by browser)
EnableSSL = false
# Should paths assume file is in Assets/Config dir or absolute?
SSLPathsAbsolute = true
# Provide name if it's in Config dir with this file or full path
SSLKey = /etc/letsencrypt/live/comm.sqrll.net/privkey.pem
# Provide name if it's in Config dir with this file or full path
SSLCert = /etc/letsencrypt/live/comm.sqrll.net/fullchain.pem

# How long does user session live before ending (in seconds)
# 180000 - 50*60*60 so 50 hours
SessionLifeTime = 180000

# How long should we keep token for password reset alive (in mins)
PasswordResetTokenAliveTimeMins = 15

# How long should we keep the registration verification code alive (in mins)
RegistrationCodeAliveTimeMins = 30

# --- WebSocket settings ---
# Idle timeout in seconds before uWS disconnects an inactive client
# No application-level PING/PONG is needed — uWebSockets handles this automatically
# Client must respond to protocol-level PONG frames within this window
# Default: 300 seconds (5 minutes)
WebSocketIdleTimeoutSeconds = 90

# --- Image service settings ---
# How long (in seconds) a per-session image API key is kept before it is
# invalidated and re-issued on the next login / WebSocket reconnect.
# This bounds how long a stale key can survive after the image service
# restarts (its key registry lives in RAM and is lost on restart, causing
# 401 on uploads/GIFs for already-logged-in users).
# Set to 0 (or negative) to disable invalidation and cache keys indefinitely.
# Default: 3600 (1 hour)
ImageKeyInvalidationSeconds = 3600

# How often (in seconds) the backend polls the image service /instance endpoint
# to read its "instanceId" and detect a restart. A restart invalidates the
# service's RAM-only key registry, orphaning every issued per-session key.
# On a detected instance change the backend drops all cached per-session keys
# and re-issues them on the next login / WebSocket reconnect.
# Requires the image service to expose "instanceId" in /instance (see
# docs/image_service_api.md). Set to 0 (or negative) to disable the probe
# (the time-based invalidation above still applies).
# Default: 30
ImageInstanceProbeIntervalSeconds = 30

# --- Image service circuit breaker ---
# Number of consecutive failed image-service HTTP calls before the breaker
# opens. While open, key registration and the instance probe fail fast (no
# HTTP round-trip), so a down image service can't stall the WebSocket event
# loop or the login threads. Values <= 0 disable the breaker.
# Default: 3
ImageServiceCircuitBreakerThreshold = 3

# How long (in seconds) the circuit breaker stays open before it half-opens
# to allow a single probe to test whether the service is back. Values <= 0
# mean the breaker, once tripped, stays open until the backend is restarted.
# Default: 60
ImageServiceCircuitBreakerCooldownSeconds = 60

# --- Voice service circuit breaker ---
# Number of consecutive failed voice-service HTTP calls before the breaker
# opens. While open, room checks and room creation fail fast (no HTTP
# round-trip), so a down voice service can't stall the WebSocket event loop
# (voice joins are served synchronously). Values <= 0 disable the breaker.
# Default: 3
VoiceServiceCircuitBreakerThreshold = 3

# How long (in seconds) the circuit breaker stays open before it half-opens
# to allow a single probe to test whether the service is back. Values <= 0
# mean the breaker, once tripped, stays open until the backend is restarted.
# Default: 60
VoiceServiceCircuitBreakerCooldownSeconds = 60

# --- Logging settings ---
# Verbose logging level — controls which log macros fire at runtime (0-3)
#
#   Level | ERROR | WARN | INFO | VERBOSE
#   ------|-------|------|------|--------
#     0   |  ✅   |  ❌  |  ❌  |   ❌
#     1   |  ✅   |  ✅  |  ❌  |   ❌    ← DEFAULT (recommended for production)
#     2   |  ✅   |  ✅  |  ✅  |   ❌
#     3   |  ✅   |  ✅  |  ✅  |   ✅
#
# NOTE: In DEBUG builds, ALL levels fire unconditionally regardless of this
#       value — every log is visible during development.
# ⚠️  VERBOSE (level 3) logs raw message payloads including private chats.
# Never enable in production without understanding the privacy implications.
VerboseLoggingLevel = 1

# --- Abuse protection settings ---
# Per-IP rate limits (reset every RateLimitTimeToClearInMins minutes)
RateLimitNumberPerIP = 55
PasswordRateLimitNumberPerIP = 25
CreateServerRateLimitNumberPerIP = 2
RateLimitTimeToClearInMins = 60

# --- Two-tier global rate limiting ---
# Tier 1: Unauthenticated requests (no valid session token) — strict per-IP limit
# Protects /login, /register, static assets, and any other unauthenticated endpoints.
# Default: 300 requests per hour per IP
UnauthenticatedRequestsPerHour = 300

# Tier 2: Authenticated requests (valid session token) — per-UserID limit
# Each user gets their own quota. 50 users behind the same IP = 50 × 2000 = 100K req/h for that IP.
# Default: 2000 requests per hour per UserID
AuthenticatedRequestsPerHour = 2000

# --- Invite creation rate limiting (per IP, per clearing interval) ---
# Max number of invite codes an IP can create per hour
InviteCreateLimitPerHour = 20
# Max number of invite use attempts (successful or failed) per IP per hour
InviteUseLimitPerHour = 30

# --- Registration rate limiting (per IP, per clearing interval) ---
# Max number of new account registrations per IP per hour
# Default: 10 — prevents mass account creation / bot farms from a single IP
RegisterAccountLimitPerHour = 10

# Global request cap: maximum total requests per IP per hour across ALL endpoints (REST + WebSocket)
# Prevents any single IP from flooding the server with thousands of requests per second.
# 12000 requests per hour (~200/min, ~3.33/sec)
# May be an issue if we somehow end up with a lot of users in one location
GlobalRequestsPerHour = 12000

# Max number of characters per message
MaxMessageSize = 2048

# Length of random characters used in token generation
ServerTokenRandomLength = 64

# --- Invite settings ---
# Default max number of uses per invite
InviteDefaultMaxUses = 100
# Default invite expiration time in seconds (2592000 = 30 days)
InviteDefaultExpiresInSeconds = 2592000
# Maximum allowed invite expiration time in seconds (31536000 = 365 days = 12 months)
InviteMaxExpiresInSeconds = 31536000
# Maximum number of active (non-expired) invites per server
MaxInvitesPerServer = 25

# --- Invite abuse protection (rolling-window + ban, separate from hourly rate limits) ---
# Max failed invite attempts before an IP is banned
InviteAbuseMaxAttempts = 10
# Rolling window in seconds for counting failed attempts
InviteAbuseWindowSeconds = 120
# Ban duration in seconds (3600 = 1 hour)
InviteAbuseBanDurationSeconds = 3600

# --- Message retention (in-memory cache trim) settings ---
# Number of most recent messages kept in RAM per private conversation and per
# server text channel. When the periodic trim runs, older CACHED messages are
# dropped from memory only -- the database is NEVER modified, so full history
# stays accessible and is re-fetched from the DB on demand when a client
# scrolls back. Users, conversations, participants and channels are never
# touched.
# Set to 0 (or negative) to disable the trim.
# Default: 50
MessageRetentionCount = 50

# How often (in seconds) the in-memory cache trim runs.
# Set to 0 (or negative) to disable the trim entirely.
# DISABLED BY DEFAULT (0). Set a positive value (e.g. 300 = 5 minutes) to enable.
MessageRetentionCleanupIntervalSeconds = 0
