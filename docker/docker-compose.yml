name: communicator
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env.backend
      - .env.voice

    ports:
      - "8080:8080" # Backend rest
      - "8081:8081" # Backend socket

    network_mode: host

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

    restart: unless-stopped

  voice_service:
    build:
      context: ../services/SquirrelCommunicatorVoice
      dockerfile: Dockerfile

    env_file:
      - .env.voice

    ports:
      - "8082:8082" # Voice port

    network_mode: host
    restart: unless-stopped

  autoheal:
    image: willfarrell/autoheal
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

