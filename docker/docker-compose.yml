name: communicator
services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.release
      args:
        VERSION: ${BACKEND_VERSION:?Set BACKEND_VERSION in .env.backend}
    env_file:
      - .env.backend
      - .env.voice

    devices:
        - "/dev/urandom:/dev/urandom"

    ports:
      - "8080:8080" # Backend rest
      - "8081:8081" # Backend socket
    network_mode: host

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "autoheal=true"
    restart: unless-stopped


  voice_service:
    build:
      context: ../services/SquirrelCommunicatorVoice
      dockerfile: Dockerfile
    env_file:
      - .env.voice

    ports:
      - "8082:8082" # Voice port
    network_mode: host

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "autoheal=true"
    restart: unless-stopped


  autoheal:
    image: willfarrell/autoheal
    restart: always
    environment:
      - AUTOHEAL_INTERVAL=5           # Check every 5 seconds
      - AUTOHEAL_START_PERIOD=30      # 30 seconds to start for each container
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
